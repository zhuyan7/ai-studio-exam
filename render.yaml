services:
  - type: web
    name: python-tutor-ai
    runtime: python
    plan: free
    startCommand: python -m app.main
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_API_KEY
        sync: false